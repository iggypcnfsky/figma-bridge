<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        display: flex;
        flex-direction: column;
        margin: 0;
        font: 11px/1.35 Inter, system-ui, -apple-system, sans-serif;
        color: var(--figma-color-text, #111);
        background: transparent;
        user-select: none;
      }
      button, input, select, textarea {
        font: inherit;
        color: inherit;
        background: var(--figma-color-bg-secondary, #f5f5f5);
        border: 1px solid var(--figma-color-border, #ddd);
        border-radius: 6px;
        padding: 7px 9px;
      }
      button { cursor: pointer; }
      button:hover { border-color: var(--figma-color-border-strong, #999); }
      button:disabled { opacity: .45; cursor: default; }
      .row { display: flex; gap: 8px; align-items: center; }
      .hidden { display: none !important; }

      /* pasek statusu — widoczny zawsze */
      #bar { display: flex; gap: 6px; align-items: center; padding: 6px 8px; }
      #dot { width: 6px; height: 6px; border-radius: 50%; background: #9aa0a6; flex: 0 0 auto; }
      #dot.ok { background: #1a7f37; }
      #dot.busy { background: #bf8700; }
      #dot.bad { background: #cf222e; }
      #status { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      #toggle { padding: 2px 6px; line-height: 1; }

      /* panel */
      #panel { padding: 0 10px 10px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; flex: 1 1 auto; min-height: 0; }
      /* uchwyty we wszystkich rogach; okno rośnie od lewego górnego, więc „do wewnątrz = mniej”
         działa tak samo dla każdego rogu */
      .grip { position: fixed; width: 16px; height: 16px; z-index: 5; opacity: .4; }
      .grip::before { content: ''; position: absolute; width: 9px; height: 9px; border-style: solid;
        border-width: 0; border-color: var(--figma-color-border-strong, #999); }
      .grip[data-corner='bl'] { bottom: 0; left: 0; cursor: nesw-resize; }
      .grip[data-corner='bl']::before { bottom: 2px; left: 2px; border-bottom-width: 2px; border-left-width: 2px; }
      .grip[data-corner='br'] { bottom: 0; right: 0; cursor: nwse-resize; }
      .grip[data-corner='br']::before { bottom: 2px; right: 2px; border-bottom-width: 2px; border-right-width: 2px; }
      .grip:hover { opacity: 1; }
      .tabs { display: flex; gap: 6px; }
      .tabs button { flex: 1; padding: 7px 4px; font-size: 10px; gap: 4px; }
      .tabs button svg { width: 11px; height: 11px; }
      .tabs button.on { background: var(--figma-color-bg-brand, #0d99ff); color: #fff; border-color: transparent; }
      textarea { width: 100%; min-height: 128px; resize: vertical; line-height: 1.45; padding: 8px; }
      label { display: flex; flex-direction: column; gap: 5px; font-size: 10px; opacity: .8; }
      /* The panel's gap only spaces its direct children — these wrappers are the actual columns. */
      #genBody, #jobsBody { display: flex; flex-direction: column; gap: 10px; }
      /* the log takes the leftover height instead of leaving a dead area below it */
      #genBody { flex: 1 1 auto; min-height: 0; }
      .logbox { display: flex; flex-direction: column; flex: 0 1 auto; min-height: 70px; }
      #log { flex: 1 1 auto; max-height: none; }
      label > select, label > input { width: 100%; }
      .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      .chips { display: flex; gap: 4px; flex-wrap: wrap; }
      .chips button { padding: 3px 7px; font-size: 10px; }
      .chips button.on { border-color: var(--figma-color-border-brand, #0d99ff); color: var(--figma-color-text-brand, #0d99ff); }
      #cost { font-size: 10px; opacity: .8; min-height: 13px; }
      #go { width: 100%; padding: 11px 12px; font-size: 12px; font-weight: 600; letter-spacing: .2px; }
      #log { font-size: 10px; opacity: .75; min-height: 62px; max-height: 96px; overflow: auto; white-space: pre-wrap; }
      #preview { width: 100%; max-height: 52vh; object-fit: contain; border-radius: 6px; border: 1px solid var(--figma-color-border, #ddd); background: #000; }
      #refInfo { font-size: 10px; opacity: .75; }
      #modeHint { font-size: 10px; line-height: 1.3; color: #b26b00; }
      .dimline { font-size: 10px; opacity: .65; line-height: 1.3; }
      #jobList { display: flex; flex-direction: column; gap: 4px; }
      .job { display: grid; grid-template-columns: 8px 1fr auto; gap: 2px 6px; align-items: center;
        border: 1px solid var(--figma-color-border, #ddd); border-radius: 5px; padding: 4px 6px; cursor: pointer; }
      .job.on { border-color: var(--figma-color-border-brand, #0d99ff); }
      .job .jdot { width: 6px; height: 6px; border-radius: 50%; background: #bf8700; }
      .job.done .jdot { background: #1a7f37; }
      .job.error .jdot { background: #cf222e; }
      .job .jtext { font-size: 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .job .jmeta { font-size: 9px; opacity: .6; white-space: nowrap; }
      #modeHint button { padding: 1px 5px; font-size: 10px; margin-left: 4px; }
      #refRow .row { flex-wrap: wrap; }
      .refs { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
      .refs:empty { display: none; }
      .ref { width: 100px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
      .ref .thumb { position: relative; width: 100px; height: 100px; border-radius: 6px; overflow: hidden;
        border: 1px solid var(--figma-color-border, #ddd); background: #000; }
      .ref img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .ref button { position: absolute; top: 3px; right: 3px; width: 20px; height: 20px; padding: 0;
        font-size: 12px; line-height: 20px; text-align: center; border-radius: 50%;
        background: rgba(0,0,0,.72); color: #fff; border: 1px solid rgba(255,255,255,.35); }
      .ref button:hover { background: #cf222e; border-color: #cf222e; }
      .refnum { position: absolute; left: 0; bottom: 0; font-size: 10px; line-height: 15px; padding: 0 5px;
        background: rgba(0,0,0,.72); color: #fff; border-radius: 0 5px 0 0; pointer-events: none; font-weight: 600; }
      .refname { width: 100px; font-size: 10px; line-height: 13px; text-align: center; opacity: .8;
        overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2;
        word-break: break-all; }
      #maskCanvas { max-width: 100%; border-radius: 5px; border: 1px solid var(--figma-color-border, #ddd);
        touch-action: none; cursor: crosshair; display: block; background: #000; margin: 0 auto; }
      #maskRow #maskInfo { font-size: 10px; opacity: .75; }
      #brushSize { width: 90px; }
      #maskPick { flex: 1 1 auto; min-width: 0; }
      #maskList { display: flex; flex-direction: column; gap: 4px; }
      #maskList:empty { display: none; }
      .mask { display: grid; grid-template-columns: 34px 1fr auto; gap: 3px 6px; align-items: center;
        border: 1px solid var(--figma-color-border, #ddd); border-radius: 5px; padding: 4px; }
      .mask img { width: 34px; height: 34px; object-fit: contain; background: #000; border-radius: 3px; cursor: pointer; }
      .mask .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 4px; vertical-align: -1px; }
      .mask .nameRow { display: flex; align-items: center; gap: 4px; }
      .mask .maskname { font-size: 10px; padding: 2px 4px; }
      .mask .maskinstr { grid-column: 1 / -1; font-size: 10px; padding: 3px 5px; }
      .mask button { padding: 0 4px; border-color: transparent; background: transparent; }
      .mask button:hover { background: var(--figma-color-bg-secondary, #f5f5f5); }
      #maskErase.on { border-color: var(--figma-color-border-brand, #0d99ff); color: var(--figma-color-text-brand, #0d99ff); }
      button { display: inline-flex; align-items: center; justify-content: center; gap: 5px; }
      button svg { width: 12px; height: 12px; flex: 0 0 auto; }
      .check { flex-direction: row; align-items: center; gap: 5px; font-size: 10px; opacity: .85; }
      #sizeRow { justify-content: space-between; }
      #sizeRow .inline { flex-direction: row; align-items: center; gap: 6px; font-size: 10px; opacity: .85; }
      #sizeRow input { width: 62px; text-align: center; padding: 5px 6px; }
      #sizeRow span { opacity: .6; }
      #sizeHint { max-width: 150px; text-align: right; }
      .check input { width: auto; margin: 0; }
      .logbox { border: 1px solid var(--figma-color-border, #ddd); border-radius: 5px; }
      .loghead { display: flex; justify-content: space-between; align-items: center; padding: 2px 4px 2px 6px; border-bottom: 1px solid var(--figma-color-border, #ddd); }
      .loghead button { padding: 1px 5px; font-size: 9px; gap: 3px; }
      .loghead button svg { width: 9px; height: 9px; }
      #log { padding: 4px 6px; }

      /* agenci na canvasie */
      .pill { font-size: 9px; line-height: 14px; padding: 0 5px; border-radius: 8px; min-width: 15px; text-align: center;
        background: var(--figma-color-bg-brand-secondary, #e5f4ff); color: var(--figma-color-text-brand, #0d99ff); }
      .pill.zero { background: var(--figma-color-bg-secondary, #f0f0f0); color: var(--figma-color-text-secondary, #777); }
      #agentsBody { display: flex; flex-direction: column; gap: 10px; }
      #agentList { display: flex; flex-direction: column; gap: 4px; }
      .agent { display: flex; gap: 6px; align-items: center; padding: 4px 6px; border-radius: 5px;
        border: 1px solid var(--figma-color-border, #ddd); }
      .agent .name { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .agent .name:hover { text-decoration: underline dotted; cursor: text; }
      .agent .meta { font-size: 9px; opacity: .6; white-space: nowrap; }
      .agent button { padding: 0 5px; font-size: 10px; border-color: transparent; background: transparent; }
      .agent button:hover { background: var(--figma-color-bg-secondary, #f5f5f5); }
      .adot { width: 5px; height: 5px; border-radius: 50%; background: #1a7f37; flex: 0 0 auto; }
      .adot.busy { background: #bf8700; }
      .adot.idle { background: #9aa0a6; }
      #agentCmd { font-size: 10px; opacity: .8; word-break: break-all; min-height: 12px; user-select: text; }
      #agentsHint { font-size: 10px; opacity: .65; }
      .addRow input { flex: 1 1 auto; min-width: 0; }
    </style>
  </head>
  <body>
    <div id="bar">
      <span id="dot"></span>
      <span id="status">connecting…</span>
      <span id="agentsBadge" class="pill zero hidden" title="agents on this canvas">0</span>
      <button id="toggle" title="Image generation">⌃</button>
    </div>

    <div id="panel" class="hidden">
      <div class="tabs">
        <button data-tab="gen" class="on"><svg viewBox="0 0 12 12" fill="currentColor"><path d="M6 1l1.1 2.9L10 5l-2.9 1.1L6 9 4.9 6.1 2 5l2.9-1.1L6 1z"/></svg>Generate</button>
        <button data-tab="edit"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M8.2 1.8l2 2L4.5 9.5 2 10l.5-2.5z"/></svg>Edit</button>
        <button data-tab="jobs" title="Generations you started — click one to reopen it"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="1.5" y="2" width="9" height="2.4" rx=".6"/><rect x="1.5" y="5.6" width="9" height="2.4" rx=".6"/><rect x="1.5" y="9.2" width="9" height="1.6" rx=".6"/></svg>Jobs <span id="jobsTabCount" class="pill zero">0</span></button>
        <button data-tab="agents" title="Who is working on this canvas"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="4.6" cy="4" r="1.8"/><path d="M1.6 10c.4-1.9 1.6-2.8 3-2.8s2.6.9 3 2.8"/><circle cx="9" cy="4.6" r="1.3"/><path d="M8 8.2c1.2-.2 2.2.6 2.5 2"/></svg>Agents <span id="agentsTabCount" class="pill zero">0</span></button>
      </div>

      <div id="modeHint" class="dim hidden"></div>

      <div id="genBody">
      <div id="refRow" class="hidden">
        <div class="row">
          <button id="useSel">Use selection</button>
          <button id="addSel">Add selection</button>
          <button id="addRef">Add image…</button>
          <span id="refInfo">no reference</span>
        </div>
        <div id="refList" class="refs"></div>
        <input id="refFile" type="file" accept="image/*" multiple class="hidden" />
        <div class="row" id="maskRow">
          <button id="paintMask" title="Paint an area to change">Paint mask…</button>
          <button id="maskAdd" title="New mask — autosaves the current one (N)">+</button>
          <span id="maskInfo">no masks</span>
        </div>
        <div id="maskList"></div>
        <div id="maskEditor" class="hidden">
          <div class="row">
            <select id="maskPick" title="which mask you are painting"></select>
            <button id="maskNew" title="start another mask in a new colour">+ new</button>
          </div>
          <div class="row">
            <input id="brushSize" type="range" min="4" max="120" value="32" />
            <button id="maskErase" title="Erase (E)">Erase</button>
            <button id="maskClear" title="Clear the mask">Clear</button>
          </div>
          <canvas id="maskCanvas"></canvas>
          <div class="row">
            <button id="maskSave">Use mask</button>
            <button id="maskCancel">Cancel</button>
          </div>
        </div>
      </div>

      <label>Model
        <select id="model"></select>
      </label>

      <textarea id="prompt" placeholder="Describe the change — point at pictures and masks: #image2, #mask1"></textarea>

      <div class="row" id="sizeRow">
        <label class="inline">Size
          <input id="sizeW" type="number" min="64" max="8192" step="8" placeholder="W" />
          <span>×</span>
          <input id="sizeH" type="number" min="64" max="8192" step="8" placeholder="H" />
        </label>
        <span class="dimline" id="sizeHint">W×H, or Use selection to match the frame</span>
      </div>

      <div class="pair">
        <label>reasoning <select id="reasoning"></select></label>
        <label>quality <select id="quality"></select></label>
      </div>

      <div id="cost"></div>
      <button id="go">Generate</button>
      <div class="logbox">
        <div class="loghead"><span>log</span><button id="copyLog" title="Copy log to clipboard">Copy</button></div>
        <div id="log"></div>
      </div>

      <div id="result" class="hidden">
        <img id="preview" alt="result" />
        <div class="row" style="margin-top:6px">
          <button id="insert">Insert on canvas</button>
          <button id="fill">Fill selection</button>
        </div>
      </div>
      </div>

      <div id="jobsBody" class="hidden">
        <div class="dimline">Every run you start stays here. Click one to see its result and put its prompt back in the field — then run it again with changes.</div>
        <div id="jobList"></div>
      </div>

      <div id="agentsBody" class="hidden">
        <div id="agentsHint">Every agent that sent an operation to this canvas. Names are yours to set.</div>
        <div id="agentList"></div>
        <div class="row addRow">
          <input id="agentName" placeholder="name a new agent, e.g. claude-2" />
          <button id="addAgent">Add</button>
        </div>
        <div id="agentCmd"></div>
        <div class="row">
          <button id="copyAgentCmd" class="hidden">Copy command</button>
          <button id="refreshAgents" title="Refresh">Refresh</button>
        </div>
      </div>

    </div>

    <div class="grip hidden" data-corner="bl" title="Drag to resize · double-click to reset"></div>
    <div class="grip hidden" data-corner="br" title="Drag to resize · double-click to reset"></div>

    <script>
      const BASE = 'http://localhost:3847'
      const COLLAPSED = { width: 232, height: 34 }
      const EXPANDED = { width: 360, height: 720 }
      // Okno pluginu nie ma natywnego uchwytu — przeciąganie rogu sami tłumaczymy na figma.ui.resize.
      const MIN_SIZE = { width: 300, height: 340 }
      const MAX_SIZE = { width: 1080, height: 1080 }
      const SIZE_KEY = 'figma-bridge:size'

      function loadPanelSize() {
        try {
          const raw = JSON.parse(localStorage.getItem(SIZE_KEY) || 'null')
          if (raw && Number(raw.width) && Number(raw.height)) {
            return {
              width: Math.min(MAX_SIZE.width, Math.max(MIN_SIZE.width, Number(raw.width))),
              height: Math.min(MAX_SIZE.height, Math.max(MIN_SIZE.height, Number(raw.height))),
            }
          }
        } catch {
          /* brak zapisanego rozmiaru — trudno */
        }
        return { ...EXPANDED }
      }

      function savePanelSize(size) {
        try { localStorage.setItem(SIZE_KEY, JSON.stringify(size)) } catch { /* ignore */ }
      }

      const $ = (id) => document.getElementById(id)
      const dot = $('dot')
      const statusEl = $('status')
      const state = {
        models: {},
        schema: null,
        mode: 'gen',
        identity: null,
        size: { width: 1024, height: 1024 },
        custom: { width: 1024, height: 1024 },

        refs: [],
        masks: [],
        maskEditingId: null,
        maskPainting: false,
        maskBase: null,
        agents: [],
        windows: [],
        panelSize: loadPanelSize(),
        selMode: 'base',
        jobs: [],
        focusedJob: null,
        polling: false,
        agentCmd: '',
        result: null,

        expanded: false,
        busy: false,
      }

      const ICONS = {
        chevron: '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 7.5 6 4.5l3 3"/></svg>',
        cursor: '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2 2l3.2 8 1.3-3.1L9.6 5.6 2 2z"/></svg>',
        spark: '<svg viewBox="0 0 12 12" fill="currentColor"><path d="M6 1l1.1 2.9L10 5l-2.9 1.1L6 9 4.9 6.1 2 5l2.9-1.1L6 1z"/></svg>',
        image: '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="1.5" y="2" width="9" height="8" rx="1.2"/><circle cx="4.2" cy="4.8" r="1"/><path d="M2 9l3-3 2 2 1.5-1.5L10.5 9"/></svg>',
        droplet: '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M6 1.5S2.8 5 2.8 7.2A3.2 3.2 0 0 0 6 10.4a3.2 3.2 0 0 0 3.2-3.2C9.2 5 6 1.5 6 1.5z"/></svg>',
        copy: '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="4" y="4" width="6" height="6" rx="1"/><path d="M8 4V2.5A.5.5 0 0 0 7.5 2h-5a.5.5 0 0 0-.5.5v5c0 .3.2.5.5.5H4"/></svg>',
      }

      const sleep = (ms) => new Promise((r) => setTimeout(r, ms))
      const setStatus = (text, kind, tooltip) => {
        statusEl.textContent = text
        statusEl.title = tooltip || text
        dot.className = kind || ''
      }
      const toPlugin = (msg) => parent.postMessage({ pluginMessage: msg }, '*')

      // ---------------------------------------------------------------- mostek
      // Ten sam long-poll co wcześniej: to on utrzymuje połączenie agenta z Figmą.
      function pollUrl() {
        const params = new URLSearchParams({ client: state.identity ? state.identity.clientId : 'starting' })
        if (state.identity && state.identity.file) params.set('file', state.identity.file)
        if (state.identity && state.identity.page) params.set('page', state.identity.page)
        return BASE + '/poll?' + params.toString()
      }

      async function bridgeLoop() {
        for (;;) {
          const ctrl = new AbortController()
          const timer = setTimeout(() => ctrl.abort(), 40000)
          try {
            const res = await fetch(pollUrl(), { cache: 'no-store', signal: ctrl.signal })
            clearTimeout(timer)
            const job = await res.json()
            if (job && job.id) {
              setStatus(job.ops.length + ' op…', 'busy')
              toPlugin({ type: 'run', id: job.id, ops: job.ops, dryRun: job.dryRun })
            } else if (!state.polling) setStatus('ready', 'ok')
          } catch (err) {
            clearTimeout(timer)
            setStatus('no server', 'bad', 'No server on localhost:3847 — run: node server.mjs')
            await sleep(1500)
          }
        }
      }

      window.onmessage = async (event) => {
        const msg = event.data && event.data.pluginMessage
        if (!msg) return
        if (msg.type === 'identity') {
          state.identity = msg
          setStatus('ready · ' + String(msg.file || '').slice(0, 18), 'ok', msg.file + ' / ' + msg.page)
          refreshAgentBadge()
          if (!state.badgeTimer) state.badgeTimer = setInterval(refreshAgentBadge, 5000)
          return
        }
        if (msg.type === 'result') {
          const okCount = (msg.results || []).filter((r) => r.ok).length
          if (!state.polling) setStatus(msg.ok ? 'ok · ' + okCount : 'error', msg.ok ? 'ok' : 'bad', msg.error || '')
          await fetch(BASE + '/result', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ id: msg.id, ok: msg.ok, results: msg.results, error: msg.error }),
          }).catch(() => {})
          return
        }
        if (msg.type === 'selectionImage') {
          if (msg.error) {
            log('reference: ' + msg.error)
            return
          }
          // wymiary bierzemy z samych pikseli PNG, nie z tego, co zgłosił plugin — inaczej
          // maska i obraz mogą się rozjechać o współczynnik eksportu
          const dims = await new Promise((resolve) => {
            const probe = new Image()
            probe.onload = () => resolve({ width: probe.naturalWidth, height: probe.naturalHeight })
            probe.onerror = () => resolve({ width: msg.width, height: msg.height })
            probe.src = 'data:image/png;base64,' + msg.base64
          })
          if (state.selMode === 'extra') {
            // „Add selection”: kolejny obraz z canvasu, dopisany jako #imageN
            const ref = { filename: 'selection-' + (state.refs.length + 1) + '.png', base64: msg.base64, width: dims.width, height: dims.height, source: 'selection-extra' }
            addRef(ref, false)
            log('added #image' + state.refs.length + ' from the canvas (' + dims.width + '×' + dims.height + ')')
            return
          }
          addRef({ filename: 'selection.png', base64: msg.base64, width: dims.width, height: dims.height, source: 'selection' }, true)
          // rozmiar wyjścia = rozmiar zaznaczenia; to jest sens edycji istniejącego obrazka
          setSize(dims.width, dims.height)
          return
        }
        if (msg.type === 'selectionInfo') {
          const page = msg.page ? ' on "' + msg.page + '"' : ''
          for (const button of [$('useSel'), $('addSel')]) button.disabled = !msg.count
          $('useSel').title = msg.count
            ? 'use "' + msg.name + '" as the base reference'
            : 'select a layer in this Figma window' + page + ' — the plug-in only sees this window\'s page'
          $('addSel').title = msg.count
            ? 'add "' + msg.name + '" as another reference (#imageN)'
            : 'select a layer in this Figma window' + page
          return
        }
      }

      // ------------------------------------------------------------------- api
      async function api(path, options = {}) {
        const res = await fetch(BASE + path, {
          ...options,
          headers: { 'content-type': 'application/json', ...(options.headers || {}) },
        })
        if (res.status === 403) throw new Error('blocked: this request did not come from the plugin')
        const body = await res.json()
        if (!res.ok) throw new Error(body.error || 'HTTP ' + res.status)
        return body
      }

      // ---------------------------------------------------------------- model
      async function loadModels() {
        try {
          const data = await api('/image/models')
          state.models = data.models || {}
          const select = $('model')
          select.innerHTML = ''
          for (const [id, entry] of Object.entries(state.models)) {
            const option = document.createElement('option')
            option.value = id
            option.textContent = entry.label || id
            select.appendChild(option)
          }
          const wanted = state.mode === 'edit' ? data.editDefault : data.default
          if (wanted) select.value = wanted
          await loadSchema()
        } catch (err) {
          log(err.message)
        }
      }

      async function loadSchema() {
        const model = $('model').value
        if (!model) return
        try {
          const data = await api('/image/schema?model=' + encodeURIComponent(model))
          state.schema = data.fields || {}
          fillEnum('reasoning', 'reasoning_effort')
          fillEnum('quality', 'quality')
          updateCost()
        } catch (err) {
          log(err.message)
        }
      }

      function fillEnum(elementId, field) {
        const select = $(elementId)
        const fieldInfo = state.schema && state.schema[field]
        const parent = select.parentElement
        if (!fieldInfo || !fieldInfo.enum) {
          parent.classList.add('hidden')
          select.innerHTML = ''
          return
        }
        parent.classList.remove('hidden')
        select.innerHTML = ''
        for (const value of fieldInfo.enum) {
          const option = document.createElement('option')
          option.value = value
          option.textContent = value
          select.appendChild(option)
        }
        select.value = fieldInfo.default && fieldInfo.enum.includes(fieldInfo.default) ? fieldInfo.default : fieldInfo.enum[0]
      }

      // ---------------------------------------------------------------- koszt
      // ------------------------------------------------------------ referencje
      const primaryRef = () => state.refs[0] || null

      function addRef(ref, replaceSameSource) {
        if (replaceSameSource) state.refs = state.refs.filter((entry) => entry.source !== ref.source)
        state.refs.push(ref)
        if (typeof updateModeHint === 'function') updateModeHint()
        // maski są w pikselach referencji — inny rozmiar znaczy „namaluj je jeszcze raz”
        const primary = primaryRef()
        if (state.masks.length && primary && state.masks.some((mask) => mask.width !== primary.width || mask.height !== primary.height)) {
          state.masks = []
          renderMasks()
          updateCost()
          log('masks cleared — the reference changed size')
        }
        renderRefs()
        updateCost()
      }

      function removeRef(index) {
        state.refs.splice(index, 1)
        if (typeof updateModeHint === 'function') updateModeHint()
        renderRefs()
        updateCost()
      }

      function renderRefs() {
        const list = $('refList')
        list.textContent = ''
        state.refs.forEach((ref, index) => {
          const box = document.createElement('div')
          box.className = 'ref'
          box.title = '#image' + (index + 1) + ' · ' + ref.filename + ' · ' + ref.width + '×' + ref.height
          const thumb = document.createElement('div')
          thumb.className = 'thumb'
          const img = document.createElement('img')
          img.src = 'data:image/png;base64,' + ref.base64
          img.alt = ref.filename
          const remove = document.createElement('button')
          remove.textContent = '✕'
          remove.title = 'remove ' + ref.filename
          remove.onclick = () => removeRef(index)
          // numer widoczny w miniaturze = to, co wpisujesz w instrukcji jako #imageN
          const badge = document.createElement('span')
          badge.className = 'refnum'
          badge.textContent = String(index + 1)
          thumb.append(img, remove, badge)
          // podpis = dokładnie ta nazwa, którą panel wpisuje do promptu przy #imageN
          const name = document.createElement('div')
          name.className = 'refname'
          name.textContent = ref.filename
          box.append(thumb, name)
          list.append(box)
        })
        const count = state.refs.length
        $('refInfo').textContent = count === 0 ? 'no reference' : count + (count === 1 ? ' reference' : ' references')
      }

      // ------------------------------------------------------------------ maski
      // Maską rządzi fal: BIAŁE = obszar do zmiany, CZARNE = zostaw — jedna maska na jedno zlecenie.
      // Kilka masek = kilka przejść pod rząd, każde z własną instrukcją, a wynik poprzedniego
      // staje się obrazem wejściowym następnego. Dzięki temu „ściana z #image2” i „okno z #image3”
      // nie muszą lądować w tym samym zapytaniu.
      const loadImage = (src) => new Promise((resolve, reject) => {
        const image = new Image()
        image.onload = () => resolve(image)
        image.onerror = () => reject(new Error('cannot load image'))
        image.src = src
      })

      // Kolory są dla Ciebie, nie dla modelu: fal dostaje wyłącznie biel/czerń.
      // W trybie „combine” kolor staje się jednak czytelny — panel dokłada obrazek-kolorowankę,
      // a model dostaje legendę, więc wie, że czerwony obszar to ściana, a zielony to okno.
      const MASK_COLORS = ['#ff00ff', '#00b3ff', '#ffb800', '#00d68f', '#ff5c5c', '#9b5cff']

      function hexToRgb(hex) {
        const raw = String(hex || '#ff00ff').replace('#', '')
        const full = raw.length === 3 ? raw.split('').map((c) => c + c).join('') : raw
        return {
          r: parseInt(full.slice(0, 2), 16) || 0,
          g: parseInt(full.slice(2, 4), 16) || 0,
          b: parseInt(full.slice(4, 6), 16) || 0,
        }
      }

      function nextMaskName() {
        return 'mask ' + (state.masks.length + 1)
      }

      function nextMaskColor() {
        const used = new Set(state.masks.map((mask) => mask.color))
        return MASK_COLORS.find((color) => !used.has(color)) || MASK_COLORS[state.masks.length % MASK_COLORS.length]
      }

      function renderMasks() {
        const list = $('maskList')
        list.textContent = ''
        for (const mask of state.masks) {
          const row = document.createElement('div')
          row.className = 'mask'

          const thumb = document.createElement('img')
          thumb.src = 'data:image/png;base64,' + mask.base64
          thumb.title = 'click to paint over this mask'
          thumb.onclick = () => openMaskEditor(mask.id).catch((err) => log('mask: ' + err.message))

          const nameWrap = document.createElement('div')
          nameWrap.className = 'nameRow'
          const dot = document.createElement('span')
          dot.className = 'dot'
          dot.style.background = mask.color
          const name = document.createElement('input')
          name.className = 'maskname'
          name.value = mask.name
          name.title = 'mask name'
          name.onchange = () => { mask.name = name.value.trim() || nextMaskName() }
          nameWrap.append(dot, name)

          const remove = document.createElement('button')
          remove.textContent = '✕'
          remove.title = 'delete this mask'
          remove.onclick = () => {
            state.masks = state.masks.filter((entry) => entry.id !== mask.id)
            renderMasks()
            updateCost()
          }

          row.append(thumb, nameWrap, remove)
          list.append(row)
        }
        $('maskInfo').textContent = state.masks.length === 0
          ? 'no masks'
          : state.masks.length + (state.masks.length === 1 ? ' mask' : ' masks')
        renderMaskPicker()
      }

      function addMask(base64, width, height, editId) {
        if (editId) {
          const existing = state.masks.find((mask) => mask.id === editId)
          if (existing) {
            existing.base64 = base64
            existing.width = width
            existing.height = height
            renderMasks()
            updateCost()
            return existing
          }
        }
        const mask = { id: 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), name: nextMaskName(), color: nextMaskColor(), base64, width, height }
        state.masks.push(mask)
        renderMasks()
        updateCost()
        return mask
      }

      // Maska żyje w pełnej rozdzielczości referencji — podgląd jest tylko oknem na nią.
      // Dzięki temu pędzel nie jest później rozciągany z 700 px na 1920 px (stąd pixeloza).
      function seedOverlayFromMask(mask) {
        const base = state.maskBase
        if (!mask || !base) return
        const image = new Image()
        image.onload = () => {
          const scratch = document.createElement('canvas')
          scratch.width = base.maskCanvas.width
          scratch.height = base.maskCanvas.height
          const sctx = scratch.getContext('2d')
          sctx.drawImage(image, 0, 0, scratch.width, scratch.height)
          const pixels = sctx.getImageData(0, 0, scratch.width, scratch.height)
          const rgb = hexToRgb(mask.color)
          for (let i = 0; i < pixels.data.length; i += 4) {
            if (pixels.data[i] > 128) {
              pixels.data[i] = rgb.r
              pixels.data[i + 1] = rgb.g
              pixels.data[i + 2] = rgb.b
              pixels.data[i + 3] = 255
            } else {
              pixels.data[i + 3] = 0
            }
          }
          base.maskCanvas.getContext('2d').putImageData(pixels, 0, 0)
          redrawMask()
        }
        image.src = 'data:image/png;base64,' + mask.base64
      }

      // Widok cudzej maski w jej kolorze — żeby podczas malowania było widać, gdzie są pozostałe.
      async function colouriseMask(mask, width, height) {
        const image = await loadImage('data:image/png;base64,' + mask.base64)
        const canvas = document.createElement('canvas')
        canvas.width = width
        canvas.height = height
        const ctx = canvas.getContext('2d')
        ctx.drawImage(image, 0, 0, width, height)
        const pixels = ctx.getImageData(0, 0, width, height)
        const rgb = hexToRgb(mask.color)
        for (let i = 0; i < pixels.data.length; i += 4) {
          const on = pixels.data[i] > 128
          pixels.data[i] = rgb.r
          pixels.data[i + 1] = rgb.g
          pixels.data[i + 2] = rgb.b
          pixels.data[i + 3] = on ? 255 : 0
        }
        ctx.putImageData(pixels, 0, 0)
        return canvas
      }

      function renderMaskPicker() {
        const select = $('maskPick')
        if (!select) return
        select.textContent = ''
        for (const mask of state.masks) {
          const option = document.createElement('option')
          option.value = mask.id
          option.textContent = mask.name + ' (' + mask.color + ')'
          select.append(option)
        }
        if (state.maskEditingId) select.value = state.maskEditingId
        else {
          const option = document.createElement('option')
          option.value = '__new__'
          option.textContent = 'new mask (' + (state.maskBase ? state.maskBase.color : nextMaskColor()) + ')'
          select.append(option)
          select.value = '__new__'
        }
      }

      async function openMaskEditor(editId) {
        const ref = primaryRef()
        if (!ref) return log('add a reference first — the mask is painted over it')
        const image = await loadImage('data:image/png;base64,' + ref.base64)
        // źródłem prawdy są piksele PNG — fal porównuje maskę z obrazem, nie z metadanymi
        const naturalWidth = image.naturalWidth || Math.round(ref.width)
        const naturalHeight = image.naturalHeight || Math.round(ref.height)

        // maska: pełna rozdzielczość obrazu, zero skalowania przy zapisie
        const maskCanvas = document.createElement('canvas')
        maskCanvas.width = naturalWidth
        maskCanvas.height = naturalHeight

        const editing = state.masks.find((mask) => mask.id === editId)
        state.maskBase = {
          image,
          canvas: $('maskCanvas'),
          maskCanvas,
          naturalWidth,
          naturalHeight,
          color: editing ? editing.color : nextMaskColor(),
          others: [],
        }
        // pozostałe maski pokazujemy przygaszone w ich kolorach — łatwiej trafić w sąsiedni obszar
        for (const other of state.masks) {
          if (other.id === editId) continue
          try {
            state.maskBase.others.push(await colouriseMask(other, naturalWidth, naturalHeight))
          } catch {
            /* pomijamy maskę, której nie da się wczytać */
          }
        }
        state.maskEditingId = editId || null
        state.maskErase = false
        $('maskErase').classList.remove('on')
        $('maskEditor').classList.remove('hidden')
        renderMaskPicker()
        sizeMaskView()
        if (editing) seedOverlayFromMask(editing)
        log(editing
          ? 'editing ' + editing.name + ' · mask at ' + naturalWidth + '×' + naturalHeight
          : 'new mask · ' + naturalWidth + '×' + naturalHeight + ' — paint the area to change')
      }

      // Podgląd dostosowuje się do okna (także w trakcie malowania) — pędzel zostaje
      // w pikselach obrazu, więc powiększenie panelu niczego nie rozmywa.
      function sizeMaskView() {
        const base = state.maskBase
        if (!base) return
        const canvas = base.canvas
        const editorWidth = Math.max(220, ($('maskEditor').clientWidth || 328))
        const maxHeight = Math.max(180, Math.min(720, window.innerHeight * 0.55))
        let viewWidth = editorWidth
        let viewHeight = Math.round((viewWidth * base.naturalHeight) / base.naturalWidth)
        if (viewHeight > maxHeight) {
          viewHeight = Math.round(maxHeight)
          viewWidth = Math.round((viewHeight * base.naturalWidth) / base.naturalHeight)
        }
        const dpr = Math.min(2, window.devicePixelRatio || 1)
        canvas.style.width = viewWidth + 'px'
        canvas.style.height = viewHeight + 'px'
        canvas.width = Math.round(viewWidth * dpr)
        canvas.height = Math.round(viewHeight * dpr)
        redrawMask()
      }

      function redrawMask() {
        const base = state.maskBase
        if (!base) return
        const ctx = base.canvas.getContext('2d')
        ctx.clearRect(0, 0, base.canvas.width, base.canvas.height)
        ctx.drawImage(base.image, 0, 0, base.canvas.width, base.canvas.height)
        if (base.others && base.others.length) {
          ctx.globalAlpha = 0.3
          for (const other of base.others) ctx.drawImage(other, 0, 0, base.canvas.width, base.canvas.height)
          ctx.globalAlpha = 1
        }
        ctx.globalAlpha = 0.55
        ctx.drawImage(base.maskCanvas, 0, 0, base.canvas.width, base.canvas.height)
        ctx.globalAlpha = 1
      }

      function paintMaskAt(event) {
        const base = state.maskBase
        if (!base) return
        const rect = base.canvas.getBoundingClientRect()
        const nx = (event.clientX - rect.left) / rect.width
        const ny = (event.clientY - rect.top) / rect.height
        // pędzel jest podany w pikselach ekranu, a rysujemy w pikselach obrazu
        const scale = base.naturalWidth / rect.width
        const radius = Math.max(1, (Number($('brushSize').value) / 2) * scale)
        const ctx = base.maskCanvas.getContext('2d')
        ctx.globalCompositeOperation = state.maskErase ? 'destination-out' : 'source-over'
        ctx.fillStyle = base.color || '#ff00ff'
        ctx.beginPath()
        ctx.arc(nx * base.maskCanvas.width, ny * base.maskCanvas.height, radius, 0, Math.PI * 2)
        ctx.fill()
        state.maskDirty = true
        redrawMask()
      }

      function closeMaskEditor() {
        state.maskBase = null
        state.maskEditingId = null
        $('maskEditor').classList.add('hidden')
      }

      // Buduje gotową maskę z aktualnych kresek; null gdy nic nie pomalowano.
      function buildMask() {
        const base = state.maskBase
        if (!base) return null
        const width = base.maskCanvas.width
        const height = base.maskCanvas.height
        const pixels = base.maskCanvas.getContext('2d').getImageData(0, 0, width, height).data
        const out = document.createElement('canvas')
        out.width = width
        out.height = height
        const octx = out.getContext('2d')
        const image = octx.createImageData(width, height)
        let painted = 0
        for (let i = 0; i < pixels.length; i += 4) {
          const on = pixels[i + 3] > 40
          if (on) painted += 1
          image.data[i] = image.data[i + 1] = image.data[i + 2] = on ? 255 : 0
          image.data[i + 3] = 255
        }
        if (painted === 0) return null
        octx.putImageData(image, 0, 0)
        return {
          base64: out.toDataURL('image/png').split(',')[1],
          width,
          height,
          painted: painted / (width * height),
        }
      }

      /**
       * Zapisuje bieżące kreski. `silent` = autosave: bez zamykania edytora i bez marudzenia,
       * ale też bez tworzenia pustej maski — pusta po prostu nie powstaje.
       */
      function saveMask(silent) {
        const built = buildMask()
        if (!built) {
          if (!silent) log('mask is empty — paint the area to change')
          return null
        }
        const editId = state.maskEditingId
        const mask = addMask(built.base64, built.width, built.height, editId)
        state.maskDirty = false
        // po autosave jesteśmy „w” tej masce — kolejne kreski dopisują do niej, nie tworzą nowej
        state.maskEditingId = mask.id
        if (!silent) {
          closeMaskEditor()
          log((editId ? 'updated ' + mask.name : 'added ' + mask.name) + ' at ' + built.width + '×' + built.height +
            ' · ' + Math.round(built.painted * 100) + '% of the area will change')
        }
        return mask
      }

      // Przełączenie maski najpierw zapisuje to, co już namalowane (autosave), więc
      // „+ new” jest jednym kliknięciem, a nie „zamknij, zapisz, otwórz, nazwij”.
      async function switchMask(nextId) {
        if (state.maskBase && state.maskDirty) {
          const saved = saveMask(true)
          if (saved) log('autosaved ' + saved.name + ' before switching')
        }
        await openMaskEditor(nextId)
      }

      // #image2 → „reference image 2 (filename)”: kolejność miniatur jest kolejnością obrazów
      function expandRefs(text) {
        return String(text || '').replace(/#image\s*(\d+)/gi, (whole, digits) => {
          const index = Number(digits) - 1
          const ref = state.refs[index]
          if (!ref) {
            log('#image' + digits + ' does not exist — there are ' + state.refs.length + ' reference(s)')
            return whole
          }
          return 'reference image ' + digits + ' (' + ref.filename + ')'
        })
      }

      // Prompt i instrukcje masek skleja jedno miejsce — dzięki temu wiadomo, co dokładnie leci.
      // Prompt jest jedynym nosnikiem instrukcji - maska tylko ogranicza obszar.
      function composePrompt(prompt, masks) {
        const main = expandMasks(expandRefs(String(prompt || '').trim()))
        if (masks.length === 0) return main
        if (masks.length === 1) {
          return main + '\n\nThe attached mask marks the only area that may change (' +
            '"' + masks[0].name + '" in ' + masks[0].color + '). ' + INPAINT_HINT
        }
        const legend = masks.map((mask) => '"' + mask.name + '" in ' + mask.color).join('; ')
        return main + '\n\nThe last attached image is a colour map of the masked areas: ' + legend +
          '. Change only the marked areas, keep everything else untouched. ' + INPAINT_HINT
      }

      // Unia masek (biel wygrywa) + kolorowanka referencji, którą model może przeczytać.
      async function combineMasks(masks, ref) {
        const width = Math.round(ref.width || 1024)
        const height = Math.round(ref.height || 1024)
        const baseImage = await loadImage('data:image/png;base64,' + ref.base64)

        const union = document.createElement('canvas')
        union.width = width
        union.height = height
        const uctx = union.getContext('2d')
        uctx.fillStyle = '#000'
        uctx.fillRect(0, 0, width, height)

        const colorMap = document.createElement('canvas')
        colorMap.width = width
        colorMap.height = height
        const cctx = colorMap.getContext('2d')
        cctx.drawImage(baseImage, 0, 0, width, height)

        for (const mask of masks) {
          const image = await loadImage('data:image/png;base64,' + mask.base64)
          uctx.drawImage(image, 0, 0, width, height)
          const tint = document.createElement('canvas')
          tint.width = width
          tint.height = height
          const tctx = tint.getContext('2d')
          tctx.drawImage(image, 0, 0, width, height)
          const pixels = tctx.getImageData(0, 0, width, height)
          const rgb = hexToRgb(mask.color)
          for (let i = 0; i < pixels.data.length; i += 4) {
            const on = pixels.data[i] > 128
            pixels.data[i] = rgb.r
            pixels.data[i + 1] = rgb.g
            pixels.data[i + 2] = rgb.b
            pixels.data[i + 3] = on ? 255 : 0
          }
          tctx.putImageData(pixels, 0, 0)
          cctx.globalAlpha = 0.75
          cctx.drawImage(tint, 0, 0)
          cctx.globalAlpha = 1
        }

        return {
          mask: { filename: 'mask-union.png', base64: union.toDataURL('image/png').split(',')[1], width, height },
          colorMap: { filename: 'color-map.png', base64: colorMap.toDataURL('image/png').split(',')[1] },
        }
      }

      // Model potrafi „wywalić” element, malując w to miejsce czarną plamę. Mówimy wprost,
      // że obszar ma być odbudowany z otoczenia — to jest różnica między usunięciem a zamalowaniem.
      const INPAINT_HINT = 'Rebuild that area from its surroundings: remove what was there and continue ' +
        'the background, textures and lighting across it — no black, flat or empty patches.'

      // #mask2 -> '"mask 2" (marked #00b3ff)': maski maja nazwy i kolory, wiec wskazujesz je
      // w promptcie tak samo jak obrazy.
      function expandMasks(text) {
        return String(text || '').replace(/#mask\s*(\d+)/gi, (whole, digits) => {
          const mask = state.masks[Number(digits) - 1]
          if (!mask) {
            log('#mask' + digits + ' does not exist - there are ' + state.masks.length + ' mask(s)')
            return whole
          }
          return '"' + mask.name + '" (marked ' + mask.color + ')'
        })
      }

      // Rozmiar jest dokładnie tym, co widać w W×H — albo tym, co przyszło z zaznaczenia.
      function currentSize() {
        const width = Math.max(64, Math.min(8192, Math.round(Number($('sizeW').value) || state.custom.width || 1024)))
        const height = Math.max(64, Math.min(8192, Math.round(Number($('sizeH').value) || state.custom.height || 1024)))
        state.custom = { width, height }
        return { width, height }
      }

      function setSize(width, height) {
        state.custom = { width: Math.round(width), height: Math.round(height) }
        $('sizeW').value = state.custom.width
        $('sizeH').value = state.custom.height
        updateCost()
      }

      function updateCost() {
        const model = $('model').value
        const entry = state.models[model]
        const pricing = entry && entry.pricing
        const quality = $('quality').value || 'auto'
        if (!pricing) return ($('cost').textContent = '')
        const base = pricing.baseImageTokens && pricing.baseImageTokens[quality]
        if (!base) return ($('cost').textContent = '')
        const dims = currentSize()
        const tokens = (base * dims.width * dims.height) / (1024 * 1024)
        const maskCount = state.mode === 'edit' ? state.masks.filter((mask) => mask.base64).length : 0
        // kilka masek = jeden obrazek-kolorowanka więcej w referencjach
        const refCount = (state.mode === 'edit' ? state.refs.length : 0) + (maskCount > 1 ? 1 : 0)
        const refs = refCount * (pricing.referenceTokensPerImage || 0)
        const promptTokens = Math.max(1, Math.ceil(($('prompt').value || '').length / 4))
        const cost =
          (tokens * pricing.imageOutputTokensPerM) / 1e6 +
          ((promptTokens + refs) * pricing.textInputTokensPerM) / 1e6
        const rounded = Math.ceil(cost * 10000) / 10000
        $('cost').textContent =
          '≈ $' + rounded.toFixed(4) +
          (maskCount > 1 ? ' · ' + maskCount + ' masks combined' : '') +
          ' · ' + dims.width + '×' + dims.height + ' · ' + quality
      }

      // ---------------------------------------------------------------- agenci
      // Kto pracuje na tym canvasie: jedno źródło prawdy to /status serwera.
      async function refreshAgents() {
        try {
          const res = await fetch(BASE + '/status', { cache: 'no-store' })
          const data = await res.json()
          state.agents = data.agents || []
          state.windows = data.clients || []
          renderAgents()
        } catch {
          state.agents = []
          renderAgents()
        }
      }

      function agentState(agent) {
        if (agent.busy) return { dot: 'busy', label: 'busy ' + agent.busy }
        const seconds = Math.round((agent.idleMs || 0) / 1000)
        if (seconds < 90) return { dot: '', label: 'idle ' + seconds + 's' }
        return { dot: 'idle', label: Math.round(seconds / 60) + ' min ago' }
      }

      function renderAgents() {
        const list = $('agentList')
        list.textContent = ''
        const agents = state.agents || []
        for (const agent of agents) {
          const row = document.createElement('div')
          row.className = 'agent'
          const dotEl = document.createElement('span')
          const status = agentState(agent)
          dotEl.className = 'adot ' + status.dot
          const name = document.createElement('span')
          name.className = 'name'
          name.textContent = agent.name || agent.id
          name.title = agent.id + ' — click to rename'
          name.onclick = () => startRename(agent, name)
          const meta = document.createElement('span')
          meta.className = 'meta'
          meta.textContent = status.label + ' · ' + agent.runs + '× · ' + agent.ops + ' ops'
          const remove = document.createElement('button')
          remove.textContent = '✕'
          remove.title = 'forget this agent'
          remove.onclick = () => removeAgent(agent)
          row.append(dotEl, name, meta, remove)
          list.append(row)
        }
        if (agents.length === 0) {
          const empty = document.createElement('div')
          empty.className = 'agent'
          empty.innerHTML = '<span class="adot idle"></span><span class="name" style="opacity:.6">nobody yet — an agent appears on its first operation</span>'
          list.append(empty)
        }
        const active = agents.filter((a) => a.busy || (a.idleMs || 0) < 5 * 60 * 1000).length
        for (const badge of [$('agentsBadge'), $('agentsTabCount')]) {
          badge.textContent = String(active)
          badge.classList.toggle('zero', active === 0)
        }
        $('agentsBadge').classList.remove('hidden')
        $('agentsBadge').title = agents.length
          ? agents.map((a) => (a.name || a.id) + (a.busy ? ' (busy)' : '')).join(', ')
          : 'no agents yet'
        const windows = state.windows || []
        $('agentsHint').textContent = windows.length > 1
          ? windows.length + ' Figma windows connected — operations are serialised per window.'
          : 'Every agent that sent an operation to this canvas. Names are yours to set.'
      }

      // inline edit — prompt()/confirm() are unreliable inside the plugin iframe
      function startRename(agent, label) {
        const input = document.createElement('input')
        input.value = agent.name || agent.id
        input.className = 'name'
        input.style.minWidth = '0'
        label.replaceWith(input)
        input.focus()
        input.select()
        let done = false
        const commit = async (save) => {
          if (done) return
          done = true
          if (save) {
            const next = input.value.trim()
            try {
              await fetch(BASE + '/agents/' + encodeURIComponent(agent.id), {
                method: 'POST',
                headers: { 'content-type': 'application/json' },
                body: JSON.stringify({ name: next }),
              })
            } catch (err) {
              log('rename failed: ' + err.message)
            }
          }
          refreshAgents()
        }
        input.onkeydown = (event) => {
          if (event.key === 'Enter') commit(true)
          if (event.key === 'Escape') commit(false)
        }
        input.onblur = () => commit(true)
      }

      async function removeAgent(agent) {
        // no confirm(): Figma's iframe blocks modals, and the agent comes back on its next operation
        try {
          await fetch(BASE + '/agents/' + encodeURIComponent(agent.id), { method: 'DELETE' })
        } catch (err) {
          log('remove failed: ' + err.message)
        }
        refreshAgents()
      }

      async function addAgent() {
        const name = $('agentName').value.trim()
        try {
          const res = await fetch(BASE + '/agents', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ name }),
          })
          const data = await res.json()
          state.agentCmd = data.command || ''
          $('agentCmd').textContent = state.agentCmd
          $('copyAgentCmd').classList.remove('hidden')
          $('agentName').value = ''
          refreshAgents()
        } catch (err) {
          log('could not add an agent: ' + err.message)
        }
      }

      async function copyAgentCommand() {
        const text = state.agentCmd || ''
        if (!text) return
        try {
          await navigator.clipboard.writeText(text)
        } catch {
          const area = document.createElement('textarea')
          area.value = text
          document.body.appendChild(area)
          area.select()
          document.execCommand('copy')
          area.remove()
        }
        const button = $('copyAgentCmd')
        const previous = button.textContent
        button.textContent = 'Copied'
        setTimeout(() => { button.textContent = previous }, 1200)
      }

      // ----------------------------------------------------------------- tryb
      // Generate tworzy nowy obraz i ignoruje referencje — przy dwóch+ referencjach to pułapka,
      // więc mówimy to wprost i dajemy jedno kliknięcie do Edit.
      function updateModeHint() {
        const hint = $('modeHint')
        if (!hint) return
        hint.textContent = ''
        if (state.mode !== 'gen' || state.refs.length === 0) {
          hint.classList.add('hidden')
          return
        }
        hint.append(String(state.refs.length) + ' reference' + (state.refs.length === 1 ? '' : 's') +
          ' attached — Generate makes a new image and ignores them.')
        const button = document.createElement('button')
        button.textContent = 'Edit instead'
        button.onclick = () => setMode('edit')
        hint.append(button)
        hint.classList.remove('hidden')
      }

      function setMode(mode) {
        // zmiana zakładki też jest wyjściem z edytora — nie gub kresek
        if (state.mode === 'edit' && mode !== 'edit' && state.maskBase && state.maskDirty) {
          const saved = saveMask(true)
          if (saved) log('autosaved ' + saved.name + ' before leaving Edit')
        }
        state.mode = mode
        updateModeHint()
        for (const button of document.querySelectorAll('.tabs button')) {
          button.classList.toggle('on', button.dataset.tab === mode)
        }
        const agentsTab = mode === 'agents'
        const jobsTab = mode === 'jobs'
        $('genBody').classList.toggle('hidden', agentsTab || jobsTab)
        $('agentsBody').classList.toggle('hidden', !agentsTab)
        $('jobsBody').classList.toggle('hidden', !jobsTab)
        // wejście w Edit od razu pyta o zaznaczenie, zamiast czekać na rozwinięcie panelu
        if (mode === 'edit') toPlugin({ type: 'selectionInfo' })
        if (agentsTab) {
          refreshAgents()
          return
        }
        if (jobsTab) {
          renderJobs()
          return
        }
        $('refRow').classList.toggle('hidden', mode !== 'edit')
        $('go').innerHTML = (mode === 'edit' ? ICONS.image : ICONS.spark) +
          '<span>' + (mode === 'edit' ? 'Edit the image' : 'Generate') + '</span>'
        const models = Object.entries(state.models)
        const wanted = Object.keys(state.models).find((id) => (mode === 'edit' ? /\/edit$/.test(id) : !/\/edit$/.test(id)))
        if (wanted) $('model').value = wanted
        loadSchema()
        updateCost()
      }

      function log(text) {
        const line = String(text || '')
        if (!line) return
        $('log').textContent = line + '\n' + $('log').textContent
        $('log').textContent = $('log').textContent.split('\n').slice(0, 6).join('\n')
      }

      // ------------------------------------------------------------------ gen
      // ------------------------------------------------------------- kolejka zadań
      // Każde uruchomienie to osobne zlecenie: nie czekamy na wynik, tylko dopisujemy je do listy
      // i wracamy do promptu. Kilka generacji może lecieć naraz (serwer ma własny limit).
      // Snapshot = dokładnie to, co poszło do modelu: referencje, maski, rozmiar, model.
      // Bez tego „wróć do zadania i popraw prompt” używałby dzisiejszych referencji, nie tamtych.
      function snapshotState() {
        const copy = (value) => (typeof structuredClone === 'function' ? structuredClone(value) : JSON.parse(JSON.stringify(value)))
        return {
          refs: copy(state.refs),
          masks: copy(state.masks),
          size: { ...state.custom },
          custom: copy(state.custom),
          model: $('model').value,
          quality: $('quality').value,
          reasoning: $('reasoning').value,
        }
      }

      function restoreSnapshot(snapshot) {
        if (!snapshot) return false
        state.refs = snapshot.refs.map((ref) => ({ ...ref }))
        state.masks = snapshot.masks.map((mask) => ({ ...mask }))
        const size = snapshot.size || snapshot.custom || { width: 1024, height: 1024 }
        setSize(size.width, size.height)
        if (snapshot.model) $('model').value = snapshot.model
        if (snapshot.quality) $('quality').value = snapshot.quality
        if (snapshot.reasoning) $('reasoning').value = snapshot.reasoning
        state.maskEditingId = null
        state.maskBase = null
        $('maskEditor').classList.add('hidden')
        renderRefs()
        renderMasks()
        updateCost()
        return true
      }

      function renderJobs() {
        const list = $('jobList')
        if (!list) return
        list.textContent = ''
        for (const entry of state.jobs) {
          const row = document.createElement('div')
          row.className = 'job ' + (entry.status === 'done' ? 'done' : entry.status === 'error' ? 'error' : '')
          if (state.focusedJob === entry.localId) row.classList.add('on')
          const dot = document.createElement('span')
          dot.className = 'jdot'
          const text = document.createElement('span')
          text.className = 'jtext'
          text.textContent = (entry.mode === 'edit' ? 'edit · ' : 'gen · ') + entry.rawPrompt.replace(/\s+/g, ' ')
          const meta = document.createElement('span')
          meta.className = 'jmeta'
          meta.textContent = entry.status === 'done'
            ? '$' + (entry.cost ? Number(entry.cost).toFixed(4) : '?')
            : entry.status
          row.append(dot, text, meta)
          row.title = 'click to reopen: result, prompt, references and masks from this run'
          row.onclick = () => openJob(entry)
          list.append(row)
        }
        const active = state.jobs.filter((entry) => entry.status === 'running').length
        const badge = $('jobsTabCount')
        if (badge) {
          badge.textContent = String(active || state.jobs.length)
          badge.classList.toggle('zero', active === 0 && state.jobs.length === 0)
        }
        if (active) setStatus(active + ' running', 'busy', active + ' generation(s) in flight')
        else if (!state.polling) setStatus('ready', 'ok')
      }

      function openJob(entry) {
        state.focusedJob = entry.localId
        $('prompt').value = entry.rawPrompt
        if (entry.mode !== state.mode) setMode(entry.mode)
        if (restoreSnapshot(entry.snapshot)) {
          log('restored ' + entry.snapshot.refs.length + ' reference(s) and ' +
            entry.snapshot.masks.length + ' mask(s) from this run')
        }
        const result = entry.result || {}
        if (result.base64) {
          $('preview').src = 'data:image/png;base64,' + result.base64
          $('result').classList.remove('hidden')
          state.result = result
        }
        renderJobs()
        log('opened ' + (entry.mode === 'edit' ? 'edit' : 'generation') + ' ' + entry.id.slice(0, 8) + ' — prompt restored')
      }

      // jeden pollowacz dla wszystkich zadań — kolejność zakończeń nie ma znaczenia
      async function pollJobs() {
        if (state.polling) return
        state.polling = true
        try {
          for (;;) {
            const active = state.jobs.filter((entry) => entry.status === 'running')
            if (active.length === 0) break
            await sleep(1200)
            for (const entry of active) {
              try {
                const info = await api('/image/jobs/' + entry.id)
                if (info.log && info.log.length) log(info.log[info.log.length - 1])
                if (info.status === 'done') {
                  entry.status = 'done'
                  entry.result = info.result
                  entry.cost = info.result && info.result.cost
                  log('job ' + entry.id.slice(0, 8) + ' done · ' +
                    (entry.cost ? '$' + entry.cost : 'cost not recorded'))
                  const focused = state.focusedJob === entry.localId
                  const newest = !state.focusedJob || state.jobs.findIndex((j) => j.localId === entry.localId) === 0
                  if (focused || newest) {
                    state.result = info.result
                    if (info.result && info.result.base64) {
                      $('preview').src = 'data:image/png;base64,' + info.result.base64
                      $('result').classList.remove('hidden')
                    }
                  }
                  if (info.result && info.result.base64) {
                    toPlugin({
                      type: 'insertImage',
                      base64: info.result.base64,
                      width: info.result.width || entry.width,
                      height: info.result.height || entry.height,
                    })
                    log('auto-inserted job ' + entry.id.slice(0, 8))
                  }
                } else if (info.status === 'error') {
                  entry.status = 'error'
                  entry.error = info.error || 'job failed'
                  log('job ' + entry.id.slice(0, 8) + ' failed: ' + entry.error)
                }
              } catch (err) {
                log(err.message)
              }
            }
            renderJobs()
          }
        } finally {
          state.polling = false
          renderJobs()
        }
      }

      async function run() {
        const prompt = $('prompt').value.trim()
        if (!prompt) return log('prompt is empty')
        if (state.mode === 'edit' && state.refs.length === 0) {
          toPlugin({ type: 'exportSelection' })
          log('edit needs a reference — select a frame, or use "Add image…"')
          return
        }

        const masks = state.mode === 'edit' ? state.masks.filter((mask) => mask.base64) : []
        if (state.mode === 'gen' && state.refs.length > 0) {
          log('generating a NEW image — ' + state.refs.length + ' reference(s) are ignored here (Edit uses them)')
        }

        try {
          const dims = currentSize()
          let extraRefs = state.refs.slice(1)
          let passMask = null

          if (masks.length > 1) {
            const combo = await combineMasks(masks, primaryRef())
            extraRefs = [...extraRefs, combo.colorMap]
            passMask = combo.mask
            log('combining ' + masks.length + ' masks into one call · colour map attached as the last reference')
          } else if (masks.length === 1) {
            passMask = masks[0]
            log('queued · ' + masks[0].name)
          } else {
            log('queued')
          }

          const expanded = composePrompt(prompt, masks)
          log('prompt · ' + expanded.replace(/\s+/g, ' ').slice(0, 140) + (expanded.length > 140 ? '…' : ''))

          const base = primaryRef()
          if (passMask && base && (passMask.width !== base.width || passMask.height !== base.height)) {
            throw new Error('mask is ' + passMask.width + '×' + passMask.height + ' but the base image is ' +
              base.width + '×' + base.height + ' — repaint the mask on this reference (fal requires identical sizes)')
          }
          const refs = state.mode === 'edit' ? [base, ...extraRefs].filter(Boolean) : []
          const payload = {
            mode: state.mode,
            model: $('model').value,
            prompt: expanded,
            size: dims.width + 'x' + dims.height,
            reasoning: $('reasoning').value || undefined,
            quality: $('quality').value || undefined,
            background: state.mode === 'edit' ? 'opaque' : undefined,
            confirmCost: true,
          }
          if (state.mode === 'edit') {
            payload.refs = refs.map((ref) => ({ filename: ref.filename, base64: ref.base64 }))
          }
          if (passMask) payload.mask = { filename: 'mask.png', base64: passMask.base64 }

          // snapshot PRZED wysłaniem: w trakcie requestu nie chcemy już nic zmieniać
          const snapshot = snapshotState()
          const job = await api('/image/jobs', { method: 'POST', body: JSON.stringify(payload) })
          const entry = {
            localId: 'j' + Date.now().toString(36) + Math.random().toString(36).slice(2, 4),
            id: job.id,
            snapshot,
            mode: state.mode,
            rawPrompt: prompt,
            status: 'running',
            width: dims.width,
            height: dims.height,
            cost: null,
            result: null,
            error: null,
            createdAt: Date.now(),
          }
          state.jobs.unshift(entry)
          state.focusedJob = entry.localId
          // historia trzyma obrazy w pamięci, więc ograniczamy ją do 15 zakończonych zadań
          while (state.jobs.length > 15) {
            const lastDone = [...state.jobs].reverse().find((item) => item.status !== 'running')
            if (!lastDone) break
            state.jobs = state.jobs.filter((item) => item.localId !== lastDone.localId)
          }
          renderJobs()
          log('job ' + job.id.slice(0, 8) + ' started — you can start another one')
          pollJobs()
        } catch (err) {
          log(err.message)
          setStatus('error', 'bad', err.message)
        }
      }

      // --------------------------------------------------------------- zdarzenia
      $('toggle').onclick = () => {
        if (state.maskBase && state.maskDirty) {
          const saved = saveMask(true)
          if (saved) log('autosaved ' + saved.name + ' before closing the panel')
        }
        state.expanded = !state.expanded
        $('panel').classList.toggle('hidden', !state.expanded)
        $('toggle').style.transform = state.expanded ? 'rotate(180deg)' : 'none'
        const size = state.expanded ? state.panelSize : COLLAPSED
        for (const grip of document.querySelectorAll('.grip')) grip.classList.toggle('hidden', !state.expanded)
        toPlugin({ type: 'resize', width: size.width, height: size.height })
        if (state.expanded) {
          if (!Object.keys(state.models).length) loadModels()
          loadPresets()
          toPlugin({ type: 'selectionInfo' })
          refreshAgents()
          if (!state.agentTimer) state.agentTimer = setInterval(() => {
            if (!state.expanded) return
            if (state.mode === 'agents') refreshAgents()
            else refreshAgentBadge()
          }, 3000)
        }
      }

      // poza zakładką Agents wystarczy licznik: mniej ruchu, ten sam sygnał
      async function refreshAgentBadge() {
        try {
          const data = await (await fetch(BASE + '/status', { cache: 'no-store' })).json()
          state.agents = data.agents || []
          state.windows = data.clients || []
          const active = state.agents.filter((a) => a.busy || (a.idleMs || 0) < 5 * 60 * 1000).length
          const badge = $('agentsBadge')
          badge.textContent = String(active)
          badge.classList.remove('hidden')
          badge.classList.toggle('zero', active === 0)
          badge.title = state.agents.length
            ? state.agents.map((a) => (a.name || a.id) + (a.busy ? ' (busy)' : '')).join(', ')
            : 'no agents yet'
        } catch {
          /* server down — the status dot already says so */
        }
      }

      for (const button of document.querySelectorAll('.tabs button')) {
        button.onclick = () => setMode(button.dataset.tab)
      }

      $('addAgent').onclick = () => addAgent()
      $('refreshAgents').onclick = () => refreshAgents()
      $('copyAgentCmd').onclick = () => copyAgentCommand()
      $('agentName').onkeydown = (event) => { if (event.key === 'Enter') addAgent() }

      $('model').onchange = () => loadSchema()
      $('quality').onchange = () => updateCost()
      $('prompt').oninput = () => updateCost()
      $('go').onclick = run

      $('useSel').onclick = () => {
        state.selMode = 'base'
        toPlugin({ type: 'exportSelection' })
        log('exporting selection as the base reference…')
      }

      $('addSel').onclick = () => {
        state.selMode = 'extra'
        toPlugin({ type: 'exportSelection' })
        log('exporting selection as another reference…')
      }

      $('addRef').innerHTML = ICONS.image + '<span>Add image</span>'
      $('addRef').onclick = () => $('refFile').click()

      // ------------------------------------------------------------ rozmiar okna
      // figma.ui.resize zaczepia okno w lewym górnym roku ekranu, więc uchwyt w każdym rogu
      // liczy rozmiar „do wewnątrz = mniej / na zewnątrz = więcej”, a nie przesuwa okna.
      let drag = null
      const clampSize = (size) => ({
        width: Math.min(MAX_SIZE.width, Math.max(MIN_SIZE.width, Math.round(size.width))),
        height: Math.min(MAX_SIZE.height, Math.max(MIN_SIZE.height, Math.round(size.height))),
      })

      let maskResizeTimer = 0
      window.addEventListener('resize', () => {
        if (!state.maskBase) return
        clearTimeout(maskResizeTimer)
        maskResizeTimer = setTimeout(() => sizeMaskView(), 120)
      })

      for (const grip of document.querySelectorAll('.grip')) {
        const corner = grip.dataset.corner
        const signX = corner === 'tr' || corner === 'br' ? 1 : -1
        const signY = corner === 'bl' || corner === 'br' ? 1 : -1

        grip.onpointerdown = (event) => {
          event.preventDefault()
          drag = {
            corner,
            signX,
            signY,
            startX: event.clientX,
            startY: event.clientY,
            width: window.innerWidth,
            height: window.innerHeight,
            next: null,
            frame: 0,
          }
          grip.setPointerCapture(event.pointerId)
        }

        grip.onpointermove = (event) => {
          if (!drag || drag.corner !== corner) return
          drag.next = clampSize({
            width: drag.width + signX * (event.clientX - drag.startX),
            height: drag.height + signY * (event.clientY - drag.startY),
          })
          if (drag.frame) return
          // throttle: jedno resize na klatkę, inaczej przeciąganie zamula iframe
          drag.frame = requestAnimationFrame(() => {
            if (!drag) return
            drag.frame = 0
            toPlugin({ type: 'resize', width: drag.next.width, height: drag.next.height })
          })
        }

        grip.onpointerup = () => {
          if (!drag) return
          drag = null
          state.panelSize = clampSize({ width: window.innerWidth, height: window.innerHeight })
          savePanelSize(state.panelSize)
        }
        grip.onpointercancel = () => { drag = null }
        grip.ondblclick = () => {
          state.panelSize = { ...EXPANDED }
          savePanelSize(state.panelSize)
          toPlugin({ type: 'resize', width: EXPANDED.width, height: EXPANDED.height })
        }
      }

      $('paintMask').onclick = () => switchMask().catch((err) => log('mask: ' + err.message))
      $('maskNew').onclick = () => switchMask().catch((err) => log('mask: ' + err.message))
      $('maskAdd').onclick = () => switchMask().catch((err) => log('mask: ' + err.message))
      $('maskPick').onchange = () => {
        const value = $('maskPick').value
        switchMask(value === '__new__' ? undefined : value).catch((err) => log('mask: ' + err.message))
      }
      $('maskErase').onclick = () => {
        state.maskErase = !state.maskErase
        $('maskErase').classList.toggle('on', state.maskErase)
      }
      $('maskClear').onclick = () => {
        if (!state.maskBase) return
        const ctx = state.maskBase.maskCanvas.getContext('2d')
        ctx.clearRect(0, 0, state.maskBase.maskCanvas.width, state.maskBase.maskCanvas.height)
        redrawMask()
      }
      $('maskSave').onclick = () => saveMask(false)
      $('maskCancel').onclick = () => closeMaskEditor()
      const maskCanvas = $('maskCanvas')
      const stopPainting = () => { state.maskPainting = false }
      maskCanvas.onpointerdown = (event) => {
        state.maskPainting = true
        maskCanvas.setPointerCapture(event.pointerId)
        paintMaskAt(event)
      }
      maskCanvas.onpointermove = (event) => {
        if (state.maskPainting) paintMaskAt(event)
      }
      maskCanvas.onpointerup = stopPainting
      maskCanvas.onpointercancel = stopPainting
      maskCanvas.onpointerleave = stopPainting
      // Skróty działają tylko poza polami tekstowymi — instrukcje masek to inputy.
      function isTyping(target) {
        if (!target) return false
        const tag = String(target.tagName || '').toLowerCase()
        return tag === 'input' || tag === 'textarea' || tag === 'select' || target.isContentEditable
      }

      async function cycleMask(direction) {
        const ids = state.masks.map((mask) => mask.id)
        if (ids.length === 0) return switchMask()
        // brak aktywnej maski (świeża, niezapisana) traktujemy jako „przed pierwszą”
        const index = ids.indexOf(state.maskEditingId)
        const start = index === -1 ? (direction > 0 ? -1 : 0) : index
        await switchMask(ids[(start + direction + ids.length) % ids.length])
      }

      window.addEventListener('keydown', (event) => {
        if ((event.metaKey || event.ctrlKey) && String(event.key).toLowerCase() === 's' && state.maskBase) {
          event.preventDefault()
          saveMask(false)
          return
        }
        if (!state.maskBase || isTyping(event.target)) return
        const key = String(event.key).toLowerCase()
        if (key === 'e') $('maskErase').click()
        if (key === 'n') switchMask().catch((err) => log('mask: ' + err.message))
        if (event.key === '[' || event.key === ']') cycleMask(event.key === ']' ? 1 : -1).catch((err) => log('mask: ' + err.message))
      })

      // Plik z dysku: tyle referencji, ile chcesz. Bez tego jedyną referencją była selekcja.
      $('refFile').onchange = async (event) => {
        const files = [...(event.target.files || [])]
        event.target.value = ''
        for (const file of files) {
          if (file.size > 8 * 1024 * 1024) {
            log(file.name + ' is larger than 8 MB — skipped')
            continue
          }
          try {
            const dataUrl = await new Promise((resolve, reject) => {
              const reader = new FileReader()
              reader.onload = () => resolve(reader.result)
              reader.onerror = () => reject(new Error('cannot read ' + file.name))
              reader.readAsDataURL(file)
            })
            const base64 = String(dataUrl).split(',')[1] || ''
            const size = await new Promise((resolve) => {
              const probe = new Image()
              probe.onload = () => resolve({ width: probe.naturalWidth, height: probe.naturalHeight })
              probe.onerror = () => resolve({ width: 0, height: 0 })
              probe.src = dataUrl
            })
            addRef({ filename: file.name, base64, width: size.width, height: size.height, source: 'file' })
            log('reference: ' + file.name + ' (' + size.width + '×' + size.height + ')')
          } catch (err) {
            log(err.message)
          }
        }
      }

      $('insert').onclick = () => {
        if (!state.result || !state.result.base64) return
        toPlugin({
          type: 'insertImage',
          base64: state.result.base64,
          width: state.result.width || 1024,
          height: state.result.height || 1024,
        })
        log('inserted on canvas')
      }

      $('fill').onclick = () => {
        if (!state.result || !state.result.base64) return
        toPlugin({ type: 'fillSelection', base64: state.result.base64 })
        log('applied to selection')
      }

      // ------------------------------------------------------------------ start
      // Bez tego panel startował z zakładką Generate, ale z widocznymi wierszami Edit
      // (selekcja, maski) — stan był ustawiany dopiero po kliknięciu zakładki.
      setMode('gen')

      $('sizeW').oninput = $('sizeH').oninput = () => {
        const size = currentSize()
        $('sizeHint').textContent = 'manual · ' + size.width + '×' + size.height
      }

      $('sizeW').value = state.custom.width
      $('sizeH').value = state.custom.height
      renderRefs()
      renderMasks()

      $('copyLog').innerHTML = ICONS.copy + '<span>Copy</span>'
      $('copyLog').onclick = async () => {
        const text = $('log').textContent.trim()
        if (!text) return log('log is empty')
        try {
          await navigator.clipboard.writeText(text)
        } catch {
          // iframe bez uprawnień do clipboard API — fallback na execCommand
          const area = document.createElement('textarea')
          area.value = text
          document.body.appendChild(area)
          area.select()
          document.execCommand('copy')
          area.remove()
        }
        const button = $('copyLog')
        button.innerHTML = ICONS.copy + '<span>Copied</span>'
        setTimeout(() => { button.innerHTML = ICONS.copy + '<span>Copy</span>' }, 1200)
      }

      $('useSel').innerHTML = ICONS.cursor + '<span>Use selection</span>'
      $('insert').innerHTML = ICONS.image + '<span>Insert</span>'
      $('fill').innerHTML = ICONS.droplet + '<span>Fill</span>'
      $('toggle').innerHTML = ICONS.chevron

      toPlugin({ type: 'resize', width: COLLAPSED.width, height: COLLAPSED.height })
      bridgeLoop()
    </script>
  </body>
</html>
